
services:
  postgres:
    image: postgres:17
    container_name: keyflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keyflow
      POSTGRES_USER: keyflow
      POSTGRES_PASSWORD: keyflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - keyflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyflow -d keyflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keyflow_postgres_data:
