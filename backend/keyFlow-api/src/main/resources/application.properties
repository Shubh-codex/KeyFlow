
spring.application.name=keyFlow-api

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/keyflow}
spring.datasource.username=${DB_USERNAME:keyflow}
spring.datasource.password=${DB_PASSWORD:keyflow_dev_password}

# JPA configuration
spring.jpa.open-in-view=false

# Database migrations
spring.flyway.enabled=true

# Flyway owns the schema; Hibernate only verifies that entities match it.
spring.jpa.hibernate.ddl-auto=validate

# Local server
server.port=8080
